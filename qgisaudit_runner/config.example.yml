# Copier en config_qgis.yml (ou passer --config) et adapter les chemins.
# Lecture seule : aucun secret nécessaire.

racines:
# Exemples : 
# - "M:\\SIG\\projets"
# - "S:\\Partage\\QGIS"

extensions:
  - ".qgs"
  - ".qgz"

# Bases dont les projets QGIS stockés (tables qgis_projects) sont aussi
# inventoriés : chaînes de connexion libpq. Mot de passe via pg_service.conf,
# pgpass ou PGPASSWORD, sinon demandé au lancement. Session en lecture seule.
bases:
# - "service=sig_prod"
# - "host=10.0.0.5 port=5432 dbname=sig user=lecteur"

dossier_sortie: "output"
